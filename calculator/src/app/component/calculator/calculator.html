<app-locale-switch (localeChanged)="onLocaleChange($event)"></app-locale-switch>

<p>{{reminder}}</p>
<br>
<table>
    <thead>
        <tr>
            <th>{{ enteteRepresente }}</th>
            <th>{{ enteteTaille }}</th>
            <th>{{ enteteFinition }}</th>
            <th>{{ enteteCouleur }}</th>
            <th>{{ enteteOmbrage }}</th>
            <th>{{ enteteSousTotal }}</th>
        </tr>
    </thead>
    <tbody>
        <tr
        app-decor
        #decor
        [localeObservable]="localeObservable"
        ></tr>
        @for (index of persoIndexes; track index) {
        <tr
            app-perso
            [index]="index"
            [localeObservable]="localeObservable"
        ></tr>
        }
    </tbody>
</table>
<br>

<p>Total : {{ total }}</p>
<button (click)="onSubmit()">OK</button>
<button (click)="addChar()">{{ajoutPerso}}</button>
<button (click)="delChar()">{{retraitPerso}}</button>
